[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stack-scout"
version = "0.1.0"
description = "Curated technology stack and open-source repo/model recommendations for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Melih", email = "developer@stack-scout.local" }
]
keywords = ["mcp", "fastmcp", "agent", "cursor", "antigravity", "github", "huggingface", "stack-scout"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "huggingface_hub>=0.25.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
stack-scout = "stack_scout.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
