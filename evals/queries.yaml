- id: meeting-agent
  idea: "Toplantıya katılan ve not tutan bir yapay zeka ajanı"
  layers:
    - name: asr
      query: "faster whisper"
      hf_task: "automatic-speech-recognition"
      expect_any: ["whisper", "faster-whisper", "whisperX"]
    - name: diarization
      query: "speaker diarization"
      hf_task: null
      expect_any: ["pyannote-audio", "whisperX", "simple-diarizer"]
  constraints:
    commercial_use: true
    max_vram_gb: 12.0

- id: pdf-rag
  idea: "Şirket PDF'leri üzerinde soru-cevap yapan yerel RAG sistemi"
  layers:
    - name: pdf_parser
      query: "pdf parser"
      hf_task: null
      expect_any: ["pypdf", "pdfplumber", "marker", "pymupdf"]
  constraints:
    commercial_use: true
    max_vram_gb: 8.0

- id: natural-language-docs
  idea: "Doğal dille ve Türkçe aramalarla fatura ve belge okuma"
  layers:
    - name: invoice_extract
      query: "I want a fast python tool to parse pdf invoices"
      hf_task: null
      expect_any: ["pdf", "marker", "pypdf", "invoice", "pdfplumber"]
    - name: ocr_scanner
      query: "şirket içi fatura okuyan yerel ocr aracı"
      hf_task: null
      expect_any: ["tesseract", "surya", "easyocr", "paddleocr", "ocr"]
  constraints:
    commercial_use: true
    max_vram_gb: 8.0
