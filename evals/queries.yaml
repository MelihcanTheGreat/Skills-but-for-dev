- id: meeting-assistant
  idea: "Toplantı seslerini yazıya döken ve konuşmacıları ayrıştıran ajan"
  layers:
    - name: asr
      query: "faster whisper speech to text"
      hf_task: "automatic-speech-recognition"
      expected_repos:
        - "SYSTRAN/faster-whisper"
        - "openai/whisper"
        - "m-bain/whisperX"
      expected_hf:
        - "Systran/faster-whisper-small"
        - "openai/whisper-small"
    - name: diarization
      query: "speaker diarization python"
      hf_task: null
      expected_repos:
        - "pyannote/pyannote-audio"
        - "m-bain/whisperX"
        - "modelscope/FunASR"
  constraints:
    commercial_use: true
    max_vram_gb: 12.0

- id: local-pdf-rag
  idea: "Şirket PDF belgelerini okuyup semantik arama yapan yerel RAG"
  layers:
    - name: pdf_parser
      query: "python pdf parser extraction"
      hf_task: null
      expected_repos:
        - "py-pdf/pypdf"
        - "jsvine/pdfplumber"
        - "pymupdf/PyMuPDF"
        - "VikParuchuri/marker"
    - name: embeddings
      query: "sentence transformers embedding model"
      hf_task: "feature-extraction"
      expected_repos:
        - "UKPLab/sentence-transformers"
        - "FlagOpen/FlagEmbedding"
      expected_hf:
        - "BAAI/bge-small-en-v1.5"
        - "sentence-transformers/all-MiniLM-L6-v2"
        - "intfloat/e5-small-v2"
  constraints:
    commercial_use: true
    max_vram_gb: 8.0

